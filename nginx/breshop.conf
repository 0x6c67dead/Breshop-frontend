# ─────────────────────────────────────────────
# Breshop — Nginx reverse proxy config
# Place at: /etc/nginx/sites-available/breshop
# Enable with: ln -s /etc/nginx/sites-available/breshop /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────

# Rate limiting zone (10MB state, 20 req/s per IP)
limit_req_zone $binary_remote_addr zone=breshop_limit:10m rate=20r/s;

# Upstream — Next.js container
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────
server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or EC2 public IP
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Replace with your domain or leave _ for IP
    server_name _;

    # ── TLS (Certbot will populate these) ──────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-XSS-Protection          "1; mode=block"            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self';" always;

    # ── Gzip compression ─────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml font/woff2;

    # ── Client limits ─────────────────────────
    client_max_body_size 10m;

    # ── Next.js static files (cached aggressively) ──
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Public assets ─────────────────────────
    location /public/ {
        proxy_pass http://nextjs;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── API routes (stricter rate limit) ──────
    location /api/ {
        limit_req zone=breshop_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Everything else → Next.js ─────────────
    location / {
        limit_req zone=breshop_limit burst=60 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
