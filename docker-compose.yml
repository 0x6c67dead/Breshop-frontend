version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: breshop-db-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dynasteshercules1!
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breshop-web-local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:Dynasteshercules1%21@db:5432/postgres
      DIRECT_URL: postgresql://postgres:Dynasteshercules1%21@db:5432/postgres
      NEXTAUTH_SECRET: "trabalhodefaculdadesecret"
      SUPABASE_URL: "https://lvvxxdzurqajjkhhgbnt.supabase.co"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
